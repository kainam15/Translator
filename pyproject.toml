[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "translator-lite"
version = "0.1.0"
description = "A lightweight Windows selection translator built with Python and Tkinter."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]

[project.scripts]
translator-lite-cli = "translator_lite.client:main"
translator-lite-web = "translator_lite.web.server:main"

[project.gui-scripts]
translator-lite = "translator_lite.desktop.app:main"

[tool.setuptools.packages.find]
include = ["translator_lite*"]

[tool.setuptools.package-data]
translator_lite = [
  "assets/*.ico",
  "assets/*.png",
  "assets/*.svg",
  "web/static/*.html",
]
