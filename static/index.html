<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Translator Lab</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --surface: #ffffff;
      --surface-soft: #f8faff;
      --text: #182033;
      --muted: #697386;
      --line: #dfe5ef;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-soft: #e9f0ff;
      --danger: #b42318;
      --danger-soft: #fff1f0;
      --shadow: 0 20px 55px rgba(44, 62, 95, .12);
    }

    * { box-sizing: border-box; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 12% 10%, rgba(37, 99, 235, .11), transparent 30rem),
        radial-gradient(circle at 88% 85%, rgba(14, 165, 233, .08), transparent 32rem),
        var(--bg);
      color: var(--text);
      font-family: Inter, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    }

    button, select, textarea { font: inherit; }

    .shell {
      width: min(1160px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 48px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 36px;
    }

    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 13px;
      color: #fff;
      background: linear-gradient(145deg, #3b82f6, #1d4ed8);
      box-shadow: 0 9px 20px rgba(37, 99, 235, .25);
      font-size: 20px;
      font-weight: 800;
    }
    .brand h1 { margin: 0; font-size: 19px; letter-spacing: -.02em; }
    .brand p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, .75);
      color: var(--muted);
      font-size: 12px;
      backdrop-filter: blur(10px);
    }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #16a34a; }

    .intro { margin: 0 0 22px; }
    .intro h2 { margin: 0; font-size: clamp(28px, 4vw, 42px); letter-spacing: -.04em; }
    .intro p { margin: 10px 0 0; color: var(--muted); font-size: 15px; }

    .translator {
      overflow: hidden;
      border: 1px solid rgba(207, 216, 231, .9);
      border-radius: 24px;
      background: rgba(255, 255, 255, .94);
      box-shadow: var(--shadow);
    }

    .language-bar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 16px;
      padding: 18px 22px;
      border-bottom: 1px solid var(--line);
    }

    .select-wrap { position: relative; }
    select {
      width: 100%;
      height: 42px;
      appearance: none;
      border: 1px solid transparent;
      border-radius: 11px;
      padding: 0 38px 0 12px;
      color: var(--text);
      background: var(--surface-soft);
      cursor: pointer;
      outline: none;
    }
    select:focus { border-color: #93b4ff; box-shadow: 0 0 0 3px var(--primary-soft); }
    .select-wrap::after {
      content: "⌄";
      position: absolute;
      right: 14px;
      top: 8px;
      color: var(--muted);
      pointer-events: none;
    }

    .icon-button {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--muted);
      background: #fff;
      cursor: pointer;
      transition: transform .15s ease, border-color .15s ease, color .15s ease;
    }
    .icon-button:hover { color: var(--primary); border-color: #9bb8f5; transform: translateY(-1px); }
    .icon-button:focus-visible { outline: 3px solid var(--primary-soft); }

    .panels { display: grid; grid-template-columns: 1fr 1fr; min-height: 350px; }
    .panel { display: flex; flex-direction: column; min-width: 0; padding: 22px; }
    .panel + .panel { border-left: 1px solid var(--line); background: var(--surface-soft); }
    .panel-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 28px;
      margin-bottom: 12px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    textarea {
      width: 100%;
      flex: 1;
      min-height: 230px;
      resize: vertical;
      border: 0;
      padding: 0;
      color: var(--text);
      background: transparent;
      font-size: 22px;
      line-height: 1.55;
      outline: none;
    }
    textarea::placeholder { color: #a9b1c0; }
    #output { cursor: default; }

    .panel-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-height: 40px;
      margin-top: 14px;
    }
    .counter, .meta { color: var(--muted); font-size: 12px; }
    .meta { min-height: 18px; }
    .text-action {
      border: 0;
      padding: 7px 9px;
      border-radius: 9px;
      color: var(--primary);
      background: transparent;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .text-action:hover { background: var(--primary-soft); }
    .text-action:disabled { color: #a9b1c0; cursor: not-allowed; background: transparent; }

    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 22px;
      border-top: 1px solid var(--line);
    }
    .hint { color: var(--muted); font-size: 12px; }
    .primary-button {
      min-width: 150px;
      height: 46px;
      border: 0;
      border-radius: 13px;
      padding: 0 22px;
      color: #fff;
      background: var(--primary);
      box-shadow: 0 8px 18px rgba(37, 99, 235, .23);
      font-weight: 750;
      cursor: pointer;
      transition: background .15s ease, transform .15s ease;
    }
    .primary-button:hover { background: var(--primary-hover); transform: translateY(-1px); }
    .primary-button:disabled { opacity: .65; cursor: wait; transform: none; }

    .error {
      display: none;
      margin: 16px 22px 0;
      border: 1px solid #f5b7b1;
      border-radius: 12px;
      padding: 11px 13px;
      color: var(--danger);
      background: var(--danger-soft);
      font-size: 13px;
    }
    .error.visible { display: block; }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      margin-right: 8px;
      border: 2px solid rgba(255,255,255,.5);
      border-top-color: #fff;
      border-radius: 50%;
      vertical-align: -2px;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 720px) {
      .shell { width: min(100% - 20px, 620px); padding-top: 18px; }
      .topbar { margin-bottom: 28px; }
      .status { display: none; }
      .language-bar { grid-template-columns: 1fr auto 1fr; gap: 8px; padding: 14px; }
      .panels { grid-template-columns: 1fr; }
      .panel { min-height: 290px; padding: 18px; }
      .panel + .panel { border-left: 0; border-top: 1px solid var(--line); }
      textarea { min-height: 170px; font-size: 19px; }
      .actions { padding: 14px; }
      .hint { display: none; }
      .primary-button { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">译</div>
        <div>
          <h1>Translator Lab</h1>
          <p>Google Translate web RPC tester</p>
        </div>
      </div>
      <div class="status"><span class="status-dot"></span>Local API · MkEWBc</div>
    </header>

    <section class="intro" aria-labelledby="page-title">
      <h2 id="page-title">快速测试翻译请求</h2>
      <p>输入文本，通过本地 backend 调用 Google Translate 网页内部接口。</p>
    </section>

    <section class="translator" aria-label="翻译测试工具">
      <div class="language-bar">
        <div class="select-wrap">
          <label for="source-language" class="sr-only">源语言</label>
          <select id="source-language" aria-label="源语言">
            <option value="auto">自动检测</option>
            <option value="zh-CN">中文（简体）</option>
            <option value="zh-TW">中文（繁体）</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
            <option value="fr">Français</option>
            <option value="de">Deutsch</option>
            <option value="es">Español</option>
            <option value="ru">Русский</option>
          </select>
        </div>
        <button id="swap" class="icon-button" type="button" aria-label="交换语言" title="交换语言">⇄</button>
        <div class="select-wrap">
          <label for="target-language" class="sr-only">目标语言</label>
          <select id="target-language" aria-label="目标语言">
            <option value="zh-CN">中文（简体）</option>
            <option value="zh-TW">中文（繁体）</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
            <option value="fr">Français</option>
            <option value="de">Deutsch</option>
            <option value="es">Español</option>
            <option value="ru">Русский</option>
          </select>
        </div>
      </div>

      <div id="error" class="error" role="alert"></div>

      <div class="panels">
        <div class="panel">
          <div class="panel-label">
            <span>原文</span>
            <button id="clear" class="text-action" type="button" disabled>清空</button>
          </div>
          <textarea id="input" maxlength="5000" autofocus placeholder="在这里输入要翻译的内容…" aria-label="待翻译文本"></textarea>
          <div class="panel-footer">
            <span id="counter" class="counter">0 / 5,000</span>
          </div>
        </div>

        <div class="panel">
          <div class="panel-label">
            <span>译文</span>
            <button id="copy" class="text-action" type="button" disabled>复制</button>
          </div>
          <textarea id="output" readonly placeholder="翻译结果会显示在这里" aria-label="翻译结果"></textarea>
          <div class="panel-footer">
            <span id="meta" class="meta" aria-live="polite"></span>
          </div>
        </div>
      </div>

      <div class="actions">
        <span class="hint">快捷键：Ctrl + Enter</span>
        <button id="translate" class="primary-button" type="button">开始翻译</button>
      </div>
    </section>
  </main>

  <script>
    const input = document.querySelector('#input');
    const output = document.querySelector('#output');
    const source = document.querySelector('#source-language');
    const target = document.querySelector('#target-language');
    const translateButton = document.querySelector('#translate');
    const clearButton = document.querySelector('#clear');
    const copyButton = document.querySelector('#copy');
    const swapButton = document.querySelector('#swap');
    const counter = document.querySelector('#counter');
    const meta = document.querySelector('#meta');
    const error = document.querySelector('#error');

    const languageNames = {
      'zh-CN': '中文（简体）', 'zh-TW': '中文（繁体）', en: 'English',
      ja: '日本語', ko: '한국어', fr: 'Français', de: 'Deutsch',
      es: 'Español', ru: 'Русский'
    };

    function setError(message = '') {
      error.textContent = message;
      error.classList.toggle('visible', Boolean(message));
    }

    function syncInputState() {
      const length = [...input.value].length;
      counter.textContent = `${length.toLocaleString()} / 5,000`;
      clearButton.disabled = length === 0;
    }

    function setLoading(loading) {
      translateButton.disabled = loading;
      translateButton.innerHTML = loading
        ? '<span class="spinner" aria-hidden="true"></span>翻译中…'
        : '开始翻译';
    }

    async function runTranslation() {
      const text = input.value.trim();
      if (!text) {
        setError('请先输入要翻译的文本。');
        input.focus();
        return;
      }

      setError();
      setLoading(true);
      meta.textContent = '';
      try {
        const response = await fetch('/api/translate', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({text, source: source.value, target: target.value})
        });
        const data = await response.json();
        if (!response.ok || !data.ok) {
          throw new Error(data.error || `请求失败（HTTP ${response.status}）`);
        }
        output.value = data.translation;
        copyButton.disabled = !data.translation;
        const detected = data.detectedSourceLanguage;
        meta.textContent = detected
          ? `检测到：${languageNames[detected] || detected}`
          : '';
      } catch (requestError) {
        setError(requestError.message || '翻译请求失败。');
      } finally {
        setLoading(false);
      }
    }

    input.addEventListener('input', syncInputState);
    input.addEventListener('keydown', event => {
      if (event.key === 'Enter' && (event.ctrlKey || event.metaKey)) {
        event.preventDefault();
        runTranslation();
      }
    });

    translateButton.addEventListener('click', runTranslation);
    clearButton.addEventListener('click', () => {
      input.value = '';
      output.value = '';
      meta.textContent = '';
      copyButton.disabled = true;
      setError();
      syncInputState();
      input.focus();
    });

    copyButton.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(output.value);
        const oldText = copyButton.textContent;
        copyButton.textContent = '已复制';
        setTimeout(() => { copyButton.textContent = oldText; }, 1200);
      } catch {
        setError('复制失败，请手动选择译文。');
      }
    });

    swapButton.addEventListener('click', () => {
      if (source.value === 'auto') {
        source.value = target.value;
        target.value = source.value === 'en' ? 'zh-CN' : 'en';
      } else {
        const oldSource = source.value;
        source.value = target.value;
        target.value = oldSource;
      }
      if (output.value) {
        const oldInput = input.value;
        input.value = output.value;
        output.value = oldInput;
        syncInputState();
      }
      meta.textContent = '';
      input.focus();
    });

    syncInputState();
  </script>
</body>
</html>
